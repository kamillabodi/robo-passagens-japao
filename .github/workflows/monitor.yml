name: Monitor passagens Japão

on:
  schedule:
    # horários em UTC (Brasília = UTC-3): 02:52, 07:52, 14:52, 19:52
    - cron: "52 5,10,17,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar preços
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py
      - name: Salvar resultados
        run: |
          git config user.name "robo-passagens"
          git config user.email "robo-passagens@users.noreply.github.com"
          git add data/ || true
          git commit -m "Busca $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')" || echo "nada novo"
          git push
